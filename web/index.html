<!DOCTYPE html>
<html lang="es" data-hv-shell="213">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="application-name" content="HallValla">
<meta name="hallvalla-shell-version" content="20260919.213">
<title>HallValla</title>
<link rel="icon" type="image/x-icon" href="assets/branding/hallvalla_favicon.ico?v=20260913.90">
<style>
  :root{color-scheme:dark;background:#000}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{position:fixed;inset:0;overscroll-behavior:none;touch-action:manipulation}
  #hvPhysicalViewport{position:fixed;inset:0;overflow:hidden;background:#000;contain:strict}
  #hvStageFrame{position:absolute;left:0;top:0;width:1366px;height:636px;border:0;margin:0;padding:0;background:#000;transform-origin:0 0;will-change:transform;display:block}
  #hvSafeAreaProbe{position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
  #hvStageDebug{position:fixed;left:8px;bottom:8px;z-index:10;display:none;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#e9d29d;font:11px/1.25 monospace;pointer-events:none;white-space:pre}
  html[data-hv-stage-debug="1"] #hvStageDebug{display:block}
</style>
</head>
<body>
<div id="hvPhysicalViewport">
  <iframe id="hvStageFrame" title="HallValla" allow="autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
</div>
<div id="hvSafeAreaProbe" aria-hidden="true"></div>
<div id="hvStageDebug" aria-hidden="true"></div>
<script>
(async()=>{
  'use strict';
  const SHELL_BUILD='20260919.213';
  const DESIGN_W=1366,DESIGN_H=636;
  const frame=document.getElementById('hvStageFrame');
  const debug=document.getElementById('hvStageDebug');
  const probe=document.getElementById('hvSafeAreaProbe');
  const query=new URLSearchParams(location.search);
  const debugOn=query.get('hvstageDebug')==='1'||query.get('hvdebug')==='1';
  if(debugOn)document.documentElement.dataset.hvStageDebug='1';

  async function waitWorkerActivation(worker,timeoutMs=2600){
    if(!worker||worker.state==='activated')return;
    await new Promise(resolve=>{
      let done=false;
      const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve();};
      const timer=setTimeout(finish,timeoutMs);
      worker.addEventListener('statechange',()=>{if(worker.state==='activated'||worker.state==='redundant')finish();});
    });
  }
  async function ensureCurrentServiceWorker(){
    if(!('serviceWorker' in navigator))return;
    try{
      const registration=await navigator.serviceWorker.register(`service-worker.js?v=${SHELL_BUILD}`,{scope:'./',updateViaCache:'none'});
      await registration.update().catch(()=>{});
      await waitWorkerActivation(registration.installing||registration.waiting);
      await navigator.serviceWorker.ready.catch(()=>null);
    }catch(error){
      console.warn('[HallValla] No se pudo sincronizar el Service Worker del shell:',error);
    }
  }
  await ensureCurrentServiceWorker();

  const childUrl=new URL('hallvalla-stage.html',location.href);
  for(const [key,value] of query){
    if(key==='hvstageDebug'||key==='hvdebug')continue;
    childUrl.searchParams.append(key,value);
  }
  childUrl.searchParams.set('hvfit','1');
  childUrl.searchParams.set('hvstage','1');
  childUrl.searchParams.set('hvshell','213');
  childUrl.hash=location.hash;
  frame.src=childUrl.href;

  function px(value){const n=parseFloat(value);return Number.isFinite(n)?n:0}
  function safeInsets(){
    const cs=getComputedStyle(probe);
    return{top:px(cs.paddingTop),right:px(cs.paddingRight),bottom:px(cs.paddingBottom),left:px(cs.paddingLeft)};
  }
  function fit(){
    const vv=window.visualViewport;
    const physicalW=Math.max(1,vv?vv.width:innerWidth);
    const physicalH=Math.max(1,vv?vv.height:innerHeight);
    const offsetX=vv?vv.offsetLeft:0,offsetY=vv?vv.offsetTop:0;
    const safe=safeInsets();
    const availW=Math.max(1,physicalW-safe.left-safe.right);
    const availH=Math.max(1,physicalH-safe.top-safe.bottom);
    const scale=Math.min(availW/DESIGN_W,availH/DESIGN_H);
    const usedW=DESIGN_W*scale,usedH=DESIGN_H*scale;
    const x=offsetX+safe.left+(availW-usedW)/2;
    const y=offsetY+safe.top+(availH-usedH)/2;
    frame.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;
    document.documentElement.style.setProperty('--hv-stage-scale',String(scale));
    document.documentElement.style.setProperty('--hv-stage-x',`${x}px`);
    document.documentElement.style.setProperty('--hv-stage-y',`${y}px`);
    if(debugOn)debug.textContent=`DESIGN  ${DESIGN_W}×${DESIGN_H}\nPHYSICAL ${Math.round(physicalW)}×${Math.round(physicalH)}\nSCALE   ${scale.toFixed(5)}\nOFFSET  ${Math.round(x)}, ${Math.round(y)}`;
  }
  let raf=0;
  function scheduleFit(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)}
  addEventListener('resize',scheduleFit,{passive:true});
  addEventListener('orientationchange',scheduleFit,{passive:true});
  window.visualViewport?.addEventListener('resize',scheduleFit,{passive:true});
  window.visualViewport?.addEventListener('scroll',scheduleFit,{passive:true});
  frame.addEventListener('load',()=>{
    scheduleFit();
    // Android sends gamepad state to the top document. Forward it to the logical stage.
    window.__hallvallaStageWindow=frame.contentWindow;
  });
  window.__hallvallaNativeGamepadUpdate=(payload)=>{
    try{return frame.contentWindow?.__hallvallaNativeGamepadUpdate?.(payload)}catch(_){return undefined}
  };
  window.__hallvallaNativeGoogleReceive=(...args)=>{try{return frame.contentWindow?.__hallvallaNativeGoogleReceive?.(...args)}catch(_){}};
  window.__hallvallaNativeGoogleError=(...args)=>{try{return frame.contentWindow?.__hallvallaNativeGoogleError?.(...args)}catch(_){}};
  window.__hallvallaNativeGoogleSetBusy=(...args)=>{try{return frame.contentWindow?.__hallvallaNativeGoogleSetBusy?.(...args)}catch(_){}};
  addEventListener('pointerdown',()=>{try{frame.focus()}catch(_){}},{passive:true});
  fit();
})();
</script>
</body>
</html>
