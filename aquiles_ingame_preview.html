<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aquiles in-game preview</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#050302; }
    body { display:flex; align-items:center; justify-content:center; }
    .preview-scene{
      position:relative;
      width:1100px;
      height:720px;
      overflow:hidden;
      border:1px solid rgba(255,210,102,.35);
      box-shadow:0 0 28px rgba(0,0,0,.75), inset 0 0 70px rgba(0,0,0,.35);
      background:url('assets/board_oscuro_11x6.webp') center/cover no-repeat;
    }
    .preview-dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,transparent 0 42%,rgba(0,0,0,.32) 72%,rgba(0,0,0,.62));pointer-events:none;}
    .preview-label{
      position:absolute;left:24px;top:20px;z-index:20;
      font:900 18px/1.1 system-ui, sans-serif;letter-spacing:.08em;text-transform:uppercase;
      color:#fff6c0;text-shadow:0 0 12px rgba(255,221,96,.8),0 2px 8px #000;
    }
    .preview-label small{display:block;font-size:11px;margin-top:5px;color:#e8c465;letter-spacing:.14em;}
    .preview-grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;height:620px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);z-index:5;}
    .preview-grid .cell{border:1px solid rgba(255,220,120,.06);background:rgba(0,0,0,.035);overflow:visible!important;}
    .preview-grid .cell:nth-child(13){background:rgba(255,211,88,.06);}
    .preview-grid .cell > .unit-card{height:min(118%,104px)!important;max-width:76%!important;max-height:122%!important;width:auto!important;aspect-ratio:2/3!important;margin:auto!important;}
    .preview-zoom{
      position:absolute;right:55px;top:120px;width:260px;height:390px;z-index:10;
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.22);border:1px solid rgba(255,226,115,.20);border-radius:18px;
      box-shadow:inset 0 0 28px rgba(0,0,0,.55),0 0 34px rgba(0,0,0,.45);
    }
    .preview-zoom .unit-card{position:relative!important;width:190px!important;height:285px!important;aspect-ratio:2/3!important;}
    .preview-note{
      position:absolute;right:54px;top:528px;width:263px;z-index:20;text-align:center;
      font:700 12px/1.35 system-ui, sans-serif;color:#e7d59d;text-shadow:0 2px 5px #000;
    }
  </style>
</head>
<body>
  <div class="preview-scene">
    <div class="preview-label">HallValla preview<small>Aquiles · Semidiós · marco real del juego</small></div>
    <div class="preview-grid grid">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div>
      <div class="cell">
        <div class="unit-card unit-key-achilles p1 card-type-unit card-rarity-demigod">
          <div class="unit-frame-skin" aria-hidden="true"></div>
          <div class="unit-portrait"><img src="assets/cards/special/achilles.webp" alt="Aquiles"></div>
          <div class="unit-ornate-ui">
            <span class="unit-stat-orb stat-orb-cost" title="Coste"><b>6</b></span>
            <span class="unit-stat-orb stat-orb-hp high" title="Salud actual: 7/7"><span class="unit-orb-liquid" style="height:100%"></span><b>7</b></span>
            <span class="unit-stat-orb stat-orb-atk" title="Ataque actual: 8"><b>8</b></span>
            <span class="unit-stat-orb stat-orb-aux guard" title="Guardia actual: 6"><b>6</b></span>
          </div>
        </div>
      </div>
      <div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="preview-zoom">
      <div class="unit-card unit-key-achilles p1 card-type-unit card-rarity-demigod">
        <div class="unit-frame-skin" aria-hidden="true"></div>
        <div class="unit-portrait"><img src="assets/cards/special/achilles.webp" alt="Aquiles"></div>
        <div class="unit-ornate-ui">
          <span class="unit-stat-orb stat-orb-cost" title="Coste"><b>6</b></span>
          <span class="unit-stat-orb stat-orb-hp high" title="Salud actual: 7/7"><span class="unit-orb-liquid" style="height:100%"></span><b>7</b></span>
          <span class="unit-stat-orb stat-orb-atk" title="Ataque actual: 8"><b>8</b></span>
          <span class="unit-stat-orb stat-orb-aux guard" title="Guardia actual: 6"><b>6</b></span>
        </div>
      </div>
    </div>
    <div class="preview-note">Izquierda: tamaño aproximado en tablero. Derecha: zoom usando el mismo marco real.</div>
    <div class="preview-dim"></div>
  </div>
</body>
</html>
