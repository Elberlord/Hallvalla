name: Publish HallValla Web + Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'releases/android/**'
      - '.github/workflows/publish-hallvalla-public.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hallvalla-public-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/downloads
          cp -a web/. dist/

          readarray -t META < <(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("releases/android/latest.json").read_text(encoding="utf-8-sig")
          )

          print(data.get("file", ""))
          print(data.get("releaseTag", ""))
          print(data.get("sha256", ""))
          PY
          )

          APK_FILE="${META[0]:-}"
          RELEASE_TAG="${META[1]:-}"
          EXPECTED_SHA="${META[2]:-}"

          if [[ -z "$APK_FILE" || -z "$RELEASE_TAG" || -z "$EXPECTED_SHA" ]]; then
            echo "ERROR: latest.json no contiene file, releaseTag o sha256."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/hallvalla-apk"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_FILE" \
            --dir "$RUNNER_TEMP/hallvalla-apk"

          APK_PATH="$RUNNER_TEMP/hallvalla-apk/$APK_FILE"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: No se descargó $APK_FILE desde el release $RELEASE_TAG."
            exit 1
          fi

          ACTUAL_SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: SHA-256 incorrecto."
            echo "Esperado: $EXPECTED_SHA"
            echo "Recibido: $ACTUAL_SHA"
            exit 1
          fi

          cp "$APK_PATH" dist/downloads/HallValla-Android.apk
          cp releases/android/latest.json dist/downloads/latest.json
          cp releases/android/SHA256SUMS.txt dist/downloads/SHA256SUMS.txt

          echo "HallValla Android $RELEASE_TAG publicado y SHA-256 verificado." \
            > dist/DEPLOYMENT_INFO.txt

      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy public HallValla
        id: deployment
        uses: actions/deploy-pages@v4