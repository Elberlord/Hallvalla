plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hallvalla.game'
    compileSdk 35

    // Empaqueta siempre los assets del frontend actual sin duplicarlos dentro del repo.
    // El contenido de web/assets queda disponible en AssetManager como assets/<ruta>.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../web/assets']
        }
    }

    defaultConfig {
        applicationId 'com.hallvalla.game'
        minSdk 24
        targetSdk 35
        versionCode 136
        versionName '1.0.136'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('HALLVALLA_KEYSTORE_PATH')
            def ksPass = System.getenv('HALLVALLA_KEYSTORE_PASSWORD')
            def ksAlias = System.getenv('HALLVALLA_KEY_ALIAS') ?: 'hallvalla'
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('HALLVALLA_KEYSTORE_PATH') && System.getenv('HALLVALLA_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    androidResources {
        noCompress += ['webp','png','jpg','jpeg','ico','mp3','ogg','wav']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
