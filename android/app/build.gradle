plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hallvalla.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hallvalla.game'
        minSdk 24
        targetSdk 35
        versionCode 132
        versionName '1.0.132'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('HALLVALLA_KEYSTORE_PATH')
            def ksPass = System.getenv('HALLVALLA_KEYSTORE_PASSWORD')
            def ksAlias = System.getenv('HALLVALLA_KEY_ALIAS') ?: 'hallvalla'
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('HALLVALLA_KEYSTORE_PATH') && System.getenv('HALLVALLA_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
